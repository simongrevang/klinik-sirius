server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;


    # Skråstreg til sidst sender videre til den kanoniske URL
    location ~ ^(/.+)/$ {
        return 301 $1$is_args$args;
    }

    # Hashede filnavne, så de kan caches permanent
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    # Hver rute findes som prerenderet fil. Findes filen ikke, er det en rigtig 404.
    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }
}
